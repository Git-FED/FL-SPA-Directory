// FED-SPA Wear OS module.
//
// Watch surface = glanceable verification: name -> license status in
// two taps. No subscriber tier on the wrist (tiny screen, no place for
// a code entry UX that isn't painful). Licensed data only.
//
// Data: assets/licensed.json. The unlicensed envelope is deliberately
// NOT packaged here.

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ai.ninjatech.fedspa.watch'
    compileSdk 34

    defaultConfig {
        applicationId "ai.ninjatech.fedspa.watch"
        minSdk 26
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // No wearable-support library: classic views with the round-screen
    // insets handled in layout-wear. Keeps the module dependency-free.
}
