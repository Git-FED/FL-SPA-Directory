// FED-SPA Android app module.
// Zero third-party dependencies: androidx.core only (part of the platform
// toolchain), org.json for parsing the bundled assets (bundled in Android),
// javax.crypto for AES-GCM (part of the JDK/Android runtime).
//
// Data arrives via admin_scripts/generate_public_files.py, which copies
// data/public/licensed.json -> app/src/main/assets/licensed.json and
// data/private/unlicensed.encrypted.json -> assets/unlicensed.encrypted.json.

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ai.ninjatech.fedspa'
    compileSdk 34

    defaultConfig {
        applicationId "ai.ninjatech.fedspa"
        minSdk 26          // AES-GCM via javax.crypto is stable from API 26
        maxSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            // A static-data app has no backend secrets. Signing is left to
            // whoever maintains the repo (see docs/DEPLOYMENT.md).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Deliberately sparse: AndroidX basics only (Google's own toolchain).
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // No Retrofit, no OkHttp, no Gson, no Coil, no compose - not needed:
    // data is bundled in assets, crypto is javax.crypto, UI is classic views.
}
